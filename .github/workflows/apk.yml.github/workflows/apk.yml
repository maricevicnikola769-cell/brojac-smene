name: Napravi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pripremi aplikaciju
        run: |
          mkdir -p app/www
          cp index.html app/www/
          cp manifest.webmanifest sw.js app/www/ 2>/dev/null || true
          cp -r icons app/www/ 2>/dev/null || true
          cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Brojač" rs.brojac.smene --web-dir www
          npx cap add android

      - name: Ikonica
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          cd app && mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../icons/icon.svg -o assets/icon-only.png
          rsvg-convert -w 640 -h 640 --page-width 1024 --page-height 1024 --left 192 --top 192 ../icons/icon.svg -o assets/icon-foreground.png
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#1f4fd1"/></svg>' > bg.svg
          rsvg-convert bg.svg -o assets/icon-background.png
          npx -y @capacitor/assets@3 generate --android

      - name: Napravi APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../brojac-smene.apk

      - name: Objavi APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Brojač smene
          body: Preuzmite brojac-smene.apk i otvorite ga na telefonu.
          files: brojac-smene.apk
          make_latest: true
